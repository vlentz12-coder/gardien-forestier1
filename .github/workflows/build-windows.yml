name: Build Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.2 and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Import project
        run: godot --headless --import || true

      - name: Export Windows build
        run: |
          mkdir -p build
          godot --headless --export-release "Windows Desktop" build/Gardien_forestier.exe
          cd build && zip -r ../Gardien_forestier_windows.zip .

      - name: Keep the build as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gardien_forestier_windows
          path: Gardien_forestier_windows.zip

      - name: Publish to the Releases page (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Gardien_forestier_windows.zip
